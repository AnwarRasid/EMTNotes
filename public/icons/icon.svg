<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The EMTNotes app icon: the BrandMark Star of Life (src/ui/BrandMark.tsx, in its units) over a strip of the
       two-colour band, as in the app bar, on a bay-coloured rounded square. No SCDF logo, crest or wordmark.
       tools/make_icons.mjs renders the PNGs from this file; the maskable one shows the mark at 64% of its height on a
       full bleed. -->
  <defs>
    <clipPath id="band-clip"><rect x="-48" y="60" width="96" height="26" rx="5"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#121719"/>
  <!-- The mark spans y -50 (the star's top) to 86 (the band's foot); centred on the tile at 2.8 px a unit. -->
  <g transform="translate(256 256) scale(2.8) translate(0 -18)">
    <g fill="#EEF1EC">
      <rect x="-16" y="-50" width="32" height="100" rx="2"/>
      <rect x="-16" y="-50" width="32" height="100" rx="2" transform="rotate(60)"/>
      <rect x="-16" y="-50" width="32" height="100" rx="2" transform="rotate(120)"/>
    </g>
    <g fill="#3381D4">
      <rect x="-11.5" y="-45.5" width="23" height="91"/>
      <rect x="-11.5" y="-45.5" width="23" height="91" transform="rotate(60)"/>
      <rect x="-11.5" y="-45.5" width="23" height="91" transform="rotate(120)"/>
    </g>
    <g fill="none" stroke="#EEF1EC" stroke-linecap="round">
      <path stroke-width="5.5" d="M0 -32V36"/>
      <path stroke-width="4.5" d="M-2 30C11 25 11 16 0 12C-11 8 -11 -1 0 -5C11 -9 11 -18 3 -23"/>
    </g>
    <circle cx="4" cy="-25" r="4.5" fill="#EEF1EC"/>
    <!-- The band: two rows of six, yellow first on top and orange first below. -->
    <g clip-path="url(#band-clip)">
      <rect x="-48" y="60" width="96" height="26" fill="#E3BC2B"/>
      <g fill="#E2711F">
        <rect x="-32" y="60" width="16" height="13"/>
        <rect x="0" y="60" width="16" height="13"/>
        <rect x="32" y="60" width="16" height="13"/>
        <rect x="-48" y="73" width="16" height="13"/>
        <rect x="-16" y="73" width="16" height="13"/>
        <rect x="16" y="73" width="16" height="13"/>
      </g>
    </g>
  </g>
</svg>
